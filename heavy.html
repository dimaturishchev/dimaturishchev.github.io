<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Heavy Ad Intervention demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:1rem}
h1{font-size:1.2rem;margin:.25rem}
iframe{width:100%;border:2px inset #ddd;margin:.25rem 0}
</style>
<h1>Heavy Ad Intervention ⚖️ demo</h1>
<main id="ad-area"></main>
<script>
const area=document.getElementById('ad-area');
function fid(){return'google_ads_iframe_'+crypto.randomUUID().replace(/-/g,'').slice(0,8)}
function add(src,h){const f=document.createElement('iframe');f.name=f.id=fid();f.src=src;f.width=300;f.height=h;f.scrolling='no';f.setAttribute('allow','autoplay');area.appendChild(f)}
const cpu=`<!doctype html><meta charset=utf-8><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script><style>body{margin:0;font-family:sans-serif}</style><p>Heavy CPU ad <span id=t></span></p><script>let i=0;function w(){const e=performance.now()+10;while(performance.now()<e){i++}document.getElementById("t").textContent="Ops: "+i.toLocaleString();requestAnimationFrame(w)}w();<\/script>`;
add('data:text/html;base64,'+btoa(cpu),250);
const pic='https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg';
const net=`<!doctype html><meta charset=utf-8><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script><img src="${pic}" style="width:100%">`;
add('data:text/html;base64,'+btoa(net),600);
</script>
</html>
