<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Heavy Ad Intervention demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:1rem}
h1{font-size:1.2rem;margin:.25rem}
iframe{width:100%;border:2px inset #ddd;margin:.25rem 0}
</style>

<h1>Heavy Ad Intervention ⚖️ demo</h1>
<main id="ad-area"></main>

<script>
'use strict';
const area = document.getElementById('ad-area');
const fid  = () => `google_ads_iframe_${crypto.randomUUID().replace(/-/g,'').slice(0,8)}`;

function add(src, h){
  const f = document.createElement('iframe');
  f.name = f.id = fid();          // matches Chromium’s ad-frame heuristic
  f.src  = src;
  f.width = 300;
  f.height = h;
  f.scrolling = 'no';
  f.setAttribute('allow','autoplay');
  area.appendChild(f);
}

/* ─── CPU-heavy ad ───────────────────────────────────────────── */
const cpuHTML = `<!doctype html>
<meta charset="utf-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"><\/script>
<style>
  body{margin:0;font-family:sans-serif;text-align:center}
</style>
<p>Heavy CPU ad<br><span id="ops">0</span> operations</p>
<script>
  let cnt=0;
  function crunch(){
    const end = performance.now()+10;
    while(performance.now()<end){cnt++;}
    document.getElementById('ops').textContent = cnt.toLocaleString();
    requestAnimationFrame(crunch);
  }
  crunch();
<\/script>`;
add('data:text/html;base64,' + btoa(cpuHTML), 250);

/* ─── Network-heavy ad ───────────────────────────────────────── */
const bigImg  = 'https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg';
const netHTML = `<!doctype html>
<meta charset="utf-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"><\/script>
<img src="${bigImg}" style="width:100%;display:block">`;
add('data:text/html;base64,' + btoa(netHTML), 600);
</script>
</html>
