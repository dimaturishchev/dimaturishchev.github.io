<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Heavy-Ad test (Chrome 2025)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1  { font-size: 1.25rem; margin: 0 0 .75rem; }
    iframe { width: 100%; border: 2px inset #ddd; margin: .5rem 0; }
  </style>

  <h1>Heavy Ad Intervention ⚖ demo</h1>
  <main id="zone"></main>

  <script>
    "use strict";

    const zone = document.getElementById("zone");

    const nextId = () =>
      `google_ads_iframe_${crypto.randomUUID().replace(/-/g, "").slice(0, 8)}`;

    function add(src, h) {
      const f = document.createElement("iframe");
      f.name = f.id = nextId();
      f.width = 300;
      f.height = h;
      f.scrolling = "no";
      f.allow = "autoplay";
      f.srcdoc = src;
      zone.appendChild(f);
    }

    const gads =
      "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js";
    const pixel =
      "https://securepubads.g.doubleclick.net/static/1px.png";

    const cpuSrc = `<!doctype html>
<meta charset=utf-8>
<script async src="${gads}"><\\/script>
<img src="${pixel}" width=1 height=1 alt="">
<style>body{margin:0;font-family:sans-serif;text-align:center}</style>
<p>CPU-heavy ad<br><span id=o>0</span></p>
<script>
  let n=0;
  function w(){
    const e=performance.now()+10;
    while(performance.now()<e){n++;}
    document.getElementById("o").textContent=n.toLocaleString();
    requestAnimationFrame(w);
  }
  w();
<\\/script>`;

    add(cpuSrc, 250);

    const big =
      "https://speed.hetzner.de/5MB.bin";

    const netSrc = `<!doctype html>
<meta charset=utf-8>
<script async src="${gads}"><\\/script>
<img src="${pixel}" width=1 height=1 alt="">
<img src="${big}" style="width:100%;display:block">`;

    add(netSrc, 600);
  </script>
</html>
