<!doctype html>
<meta charset=utf-8>
<title>GPU‑crash</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#wrap{position:relative;width:100%;height:100%;
animation:r .15s linear infinite}
@keyframes r{to{filter:hue-rotate(1turn)}}
.layer{position:absolute;inset:0;-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%)}
</style>
<script>
for(let i=0;i<120;i++){
 const d=document.createElement('div');d.className='layer';
 d.style.animationDelay=(i*10)+'ms';document.getElementById('wrap')?.append(d)??document.body.append(d);
}
</script>
<div id="wrap"></div>
