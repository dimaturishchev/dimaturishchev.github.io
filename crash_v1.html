<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safari Chunked Crash</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f8f8f8;
      color: #333;
    }
    #counter {
      margin-top: 1rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Crashing in Chunks…</h1>
  <p id="counter">Allocated: 0 MB</p>

  <script>
    (function chunkedCrash() {
      const allocations = [];
      const CHUNK_MB = 256;         // 256 MB per buffer
      let totalMB = 0;              // cumulative total

      function step() {
        try {
          allocations.push(new ArrayBuffer(CHUNK_MB * 1024 * 1024));
          totalMB += CHUNK_MB;
          document.getElementById('counter').textContent =
            `Allocated: ${totalMB.toLocaleString()} MB`;

          window.requestAnimationFrame(step);

        } catch (e) {
          document.getElementById('counter').textContent +=
            ' (hit buffer limit)';
          console.error('Allocation error:', e);
        }
      }

      step();
    })();
  </script>
</body>
</html>
